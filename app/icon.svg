<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="reno-ui">
  <!-- Brand square + wordmark initial. Flat, two colours, no gradient: at 16px
       in a browser tab everything else turns to mud. The blue is the sRGB
       rendering of --reno-brand-700 (oklch(0.505 0.1196 250)) from
       registry/reno/themes/base.css; SVG favicons are still fetched by tools
       that do not parse oklch(), so the value is written out here. -->
  <rect width="64" height="64" rx="14" fill="#2468a6"/>
  <path d="M20 46V18h13.6c6.5 0 10.4 3.3 10.4 8.9 0 4-2 6.8-5.6 8.1L45 46h-7.6l-5.7-9.6h-4.4V46H20zm7.3-15.2h5.5c2.7 0 4.2-1.3 4.2-3.6s-1.5-3.6-4.2-3.6h-5.5v7.2z" fill="#ffffff"/>
</svg>

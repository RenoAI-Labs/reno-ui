name: registry

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19"

jobs:
  verify:
    name: Lint, types, gates, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Generated artefacts must match their sources. Catches a preset edited
      # in the CSS instead of the config, or a demo added without regenerating.
      - name: Generated files are in sync
        run: npm run check:all

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run registry:build
      - run: npx next build

      # Every step above this line checks the code without ever running it.
      # That is how a DataGrid that rendered zero rows, and a client mode that
      # filtered nothing, stayed green for weeks. This step opens the built site
      # in the Chrome preinstalled on the runner and asserts it actually draws.
      - name: Pages must actually render
        run: |
          npx next start -p 3000 &
          npx --yes wait-on http://127.0.0.1:3000 --timeout 60000
          npm run check:render

      - name: Upload registry output
        uses: actions/upload-artifact@v4
        with:
          name: registry-json
          path: public/r/
          retention-days: 7

  install-smoke:
    name: Install into a blank project
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run registry:build

      # Building the registry is not the same as it being installable. The most
      # common defect in a self-hosted registry is a missing registryDependency
      # or npm dependency, which only shows up when something actually installs
      # from it. So: serve the built registry and install from a blank project.
      - name: Serve registry
        run: |
          npx --yes serve@14 public -l 4321 &
          npx --yes wait-on http://127.0.0.1:4321/r/registry.json --timeout 60000

      - name: Scaffold a blank consumer
        run: |
          npx --yes create-next-app@16.3.4 /tmp/consumer \
            --ts --tailwind --app --no-src-dir --eslint --use-npm --yes --skip-install
          cd /tmp/consumer
          node -e '
            const fs = require("fs");
            const cfg = {
              "$schema": "https://ui.shadcn.com/schema.json",
              style: "new-york", rsc: true, tsx: true,
              tailwind: { config: "", css: "app/globals.css", baseColor: "neutral", cssVariables: true, prefix: "" },
              iconLibrary: "lucide",
              aliases: { components: "@/components", utils: "@/lib/utils", ui: "@/components/ui", lib: "@/lib", hooks: "@/hooks" },
              registries: { "@reno": "http://127.0.0.1:4321/r/{name}.json" },
            };
            fs.writeFileSync("components.json", JSON.stringify(cfg, null, 2));
          '
          npm install --no-audit --no-fund

      - name: Install every registry item
        run: |
          node -e '
            const { items } = require(process.env.GITHUB_WORKSPACE + "/registry.json");
            console.log(items.map((i) => "@reno/" + i.name).join(" "));
          ' > /tmp/items.txt
          cd /tmp/consumer
          npx shadcn@4.19.1 add $(cat /tmp/items.txt) --yes

      - name: Every installed component must compile
        run: |
          cd /tmp/consumer
          # Importing each module forces it into the compile graph. Installing
          # cleanly is not the same as building — a missing file in an item's
          # `files[]` only surfaces here.
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("components/ui").filter((f) => f.endsWith(".tsx"));
            const name = (f) => f.replace(/\.tsx$/, "").replace(/-(.)/g, (_, c) => c.toUpperCase()).replace(/^./, (c) => c.toUpperCase()) + "Mod";
            const imports = files.map((f) => `import * as ${name(f)} from "@/components/ui/${f.replace(/\.tsx$/, "")}";`);
            fs.writeFileSync("app/page.tsx", `"use client";\n${imports.join("\n")}\nconst all = [${files.map(name).join(", ")}];\nexport default function Home() { return <main>{all.length}</main>; }\n`);
          '
          npm run build

      - name: Theme must have merged into globals.css
        run: |
          cd /tmp/consumer
          # Proves the registry:theme + cssVars mechanism actually re-themes a
          # project, rather than just dropping a file next to it.
          grep -q -- "--density-row-height" app/globals.css
          grep -q -- "--color-primary" app/globals.css

      - name: A light project must not pull the heavy upstreams
        run: |
          # The bundle split is the reason `table` and `data-grid` are separate
          # items, and the reason `empty-state` was lifted out of the grid rather
          # than copied: a project that wants an empty state should not inherit a
          # virtualization library to get one. Same for Embla and `carousel`.
          # Without this check either split regresses silently.
          #
          # Scaffolded with create-next-app rather than `npm init -y`: the shadcn
          # CLI reads tsconfig.json to resolve path aliases and refuses to run
          # without a real project.
          npx --yes create-next-app@16.3.4 /tmp/light \
            --ts --tailwind --app --no-src-dir --eslint --use-npm --yes --skip-install
          cp /tmp/consumer/components.json /tmp/light/components.json
          cd /tmp/light
          npx shadcn@4.19.1 add @reno/table @reno/empty-state @reno/error-state @reno/toggle-group @reno/theme-base --yes
          node -e '
            const deps = Object.keys(require("/tmp/light/package.json").dependencies || {});
            const banned = { tanstack: "@reno/data-grid", embla: "@reno/carousel" };
            const leaked = Object.entries(banned).flatMap(([needle, owner]) =>
              deps.filter((d) => d.includes(needle)).map((d) => `${d} (belongs to ${owner})`),
            );
            if (leaked.length) {
              console.error("Heavy upstream leaked into a light project: " + leaked.join(", "));
              process.exit(1);
            }
            console.log("Bundle boundary holds: no TanStack and no Embla in a light project.");
          '

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [verify, install-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run registry:build

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          # `deploy` prints the deployment URL on stdout. Capturing it means the
          # check below tests what was actually just deployed, rather than a
          # hostname hardcoded here — correct before the custom domain is
          # attached, and still correct afterwards.
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Registry must be reachable and installable
        run: |
          url="${{ steps.deploy.outputs.url }}"
          npx --yes wait-on "$url/r/registry.json" --timeout 120000

          # Serving the file is not the same as serving a valid registry.
          curl -fsSL "$url/r/registry.json" -o /tmp/registry.json
          node -e '
            const r = require("/tmp/registry.json");
            if (r.name !== "reno") throw new Error("unexpected registry name: " + r.name);
            if (!Array.isArray(r.items) || r.items.length === 0) throw new Error("registry has no items");
            console.log(`Registry live: ${r.items.length} items`);
          '

          # And prove the CLI can actually resolve an item from it.
          npx shadcn@4.19.1 view "$url/r/button.json"

      - name: Check the custom domain, once it is attached
        continue-on-error: true
        run: |
          # Not fatal: ui.reno.ai.vn needs a DNS record and a domain added to the
          # Vercel project. Until then this reports rather than blocks the deploy.
          if curl -fsSL --max-time 20 https://ui.reno.ai.vn/r/registry.json >/dev/null; then
            echo "ui.reno.ai.vn is live."
          else
            echo "::warning::ui.reno.ai.vn not serving the registry yet — add the domain in Vercel and point DNS at it."
          fi
